stages: [install, build-web, package-desktop]

variables:
  PNPM_PREFER_FROZEN_LOCKFILE: "false"
  PNPM_STORE_DIR: "$CI_PROJECT_DIR/.pnpm-store"
  GIT_STRATEGY: fetch

cache:
  key: "pnpm-${CI_COMMIT_REF_SLUG}"
  paths:
    - .pnpm-store

.install_base: &install_base
  image: electronuserland/builder:wine
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.0.0 --activate
    - mkdir -p .pnpm-store
    - pnpm --version
    - pnpm install --no-frozen-lockfile

install:
  stage: install
  <<: *install_base
  script:
    - echo "dependencies installed"

build-web:
  stage: build-web
  needs: ["install"]
  <<: *install_base
  script:
    - pnpm -C apps/web build
  artifacts:
    paths:
      - apps/web/dist
    expire_in: 7 days

package-desktop:
  stage: package-desktop
  needs: ["build-web"]
  <<: *install_base
  script:
    - pnpm -C apps/desktop build
    - cd apps/desktop
    - >
      npx electron-builder --win portable
      -c.appId=com.precisionplanit.vdisplay
      -c.asar=true
      -c.extraResources='[{"from":"../web/dist","to":"ui"}]'
      -c.win.target=portable
      -c.win.artifactName="VDisplay-Wizard-${CI_COMMIT_SHORT_SHA}-win-${arch}.exe"
    - ls -la dist || true
  artifacts:
    paths:
      - apps/desktop/dist/*.exe
    expire_in: 7 days
