stages: 
  - build
  - package

variables:
  GIT_STRATEGY: fetch

windows-desktop:
  image: electronuserland/builder:wine
  rules:
    - if: '$CI_COMMIT_TAG'
  stage: package
  artifacts:
    paths:
      - apps/desktop/dist/*.exe
    expire_in: 7 days
  cache:
    key: "pnpm-${CI_COMMIT_REF_SLUG}"
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - corepack prepare pnpm@9.0.0 --activate
    - pnpm --version
  script:
    - corepack enable
    - corepack prepare pnpm@9.0.0 --activate
    - pnpm install --no-frozen-lockfile
    - pnpm --filter @vdisplay/web build
    - cd apps/desktop
    - pnpm add -D electron-builder
    - pnpm run build
    - npx electron-builder --win portable \
        -c.appId=com.precisionplanit.vdisplay \
        -c.asar=true \
        -c.extraResources='[{"from":"../web/dist","to":"ui"}]' \
        -c.win.target=portable \
        -c.win.artifactName="VDisplay-Wizard-${CI_COMMIT_SHORT_SHA}-win-${CI_ARCH}.${ext}"

windows-server:
  image: golang:1.22
  rules:
    - if: '$CI_COMMIT_TAG'
  stage: build
  artifacts:
    paths:
      - apps/server/dist/vdisplay-server.exe
    expire_in: 7 days
  script:
    - cd apps/server
    - GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o dist/vdisplay-server.exe .