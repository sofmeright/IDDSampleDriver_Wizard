version: 1

ci:
  image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev

vars:
  org: prplanit
  github_org: PrPlanIT
  gitlab_group: PrPlanIT
  repo: DisplayWizard

matchers:
  branches:
    main: "^(main|dev-go-port)$"

versioning:
  tag_sources:
    - id: stable
      pattern: "^v?\\d+\\.\\d+\\.\\d+$"
    - id: prerelease
      pattern: "^v?\\d+\\.\\d+\\.\\d+-.+"
  branch_builds:
    - id: default
      base_from: [stable]
      format: "{base}-dev+{sha}"
  no_lineage:
    # dev-go-port has no version tags yet — bootstrap a dev version instead of
    # failing (mode: error). Switch to real versions by tagging vX.Y.Z.
    mode: explicit
    version: "0.0.0-dev+{sha}"

forges:
  - id: gitlab
    provider: gitlab
    url: "https://gitlab.prplanit.com"
    credentials: GITLAB

  - id: github
    provider: github
    url: "https://github.com"
    credentials: GITHUB

repos:
  - id: primary
    forge: gitlab
    project: "{var:gitlab_group}/{var:repo}"
    roles: [primary]
    branches:
      default: dev-go-port
    worktree: "."

  - id: github-mirror
    forge: github
    project: "{var:github_org}/{var:repo}"
    roles: [mirror, publish-origin]
    sync:
      git: true
      releases: true

builds:
  # Pure-Go, cross-compiled to Windows from the Linux CI (CGO off). Version info
  # is injected via -ldflags from the resolved version/sha/date.
  - id: dwiz
    kind: binary
    builder: go
    from: ./cmd/dwiz
    output: dwiz
    platforms:
      - windows/amd64
    args:
      - -ldflags
      - "-s -w -X github.com/PrPlanIT/DisplayWizard/src/version.Version={version} -X github.com/PrPlanIT/DisplayWizard/src/version.Commit={sha} -X github.com/PrPlanIT/DisplayWizard/src/version.BuildDate={date}"
    env:
      CGO_ENABLED: "0"

  # The shipped product: the Electron Windows installer. `builder: node` runs the
  # build INSIDE the electron-builder wine image (repo mounted), so electron-builder
  # cross-builds the Windows .exe from the Linux CI. depends_on: dwiz → the Go binary
  # is built first; the command stages it into ui/desktop/bin/ and builds the web
  # renderer (pnpm -r, a pnpm workspace) before electron-builder packs. Output is the
  # portable installer glob under ui/desktop/release/.
  - id: dwiz-desktop
    kind: binary
    builder: node
    from: .
    depends_on: dwiz
    platforms:
      - windows/amd64
    image: electronuserland/builder:wine
    output: ui/desktop/release/*.exe
    command: >-
      corepack enable &&
      pnpm install --no-frozen-lockfile &&
      pnpm -r build &&
      mkdir -p ui/desktop/bin &&
      cp .stagefreight/dist/windows-amd64/dwiz.exe ui/desktop/bin/dwiz.exe &&
      pnpm -C ui/desktop run pack

targets:
  # We publish ONLY the Electron installer — the actual Windows product. The bare
  # dwiz Go binary is an INGREDIENT bundled inside it (built above via dwiz-desktop's
  # depends_on), never published on its own: it has no Windows UI.
  #
  # ── Dev channel — every push / manual run on the default branch ──────────────
  - id: dwiz-desktop-dev-archive
    kind: binary-archive
    build: dwiz-desktop
    format: auto
    name: "VDisplay-Wizard-dev-{sha:8}-{os}-{arch}"
    checksums: true
    when: { branches: [main], events: [push, manual] }
    retention:
      keep_last: 6
      protect: ["VDisplay-Wizard-latest-dev-*", "VDisplay-Wizard-latest-*"]

  - id: dwiz-desktop-dev-latest
    kind: binary-archive
    build: dwiz-desktop
    format: auto
    name: "VDisplay-Wizard-latest-dev-{os}-{arch}"
    checksums: true
    when: { branches: [main], events: [push, manual] }

  # Dev release channel: publish the dev installer as a rolling latest-dev GitLab prerelease so
  # it is actually downloadable (the dev binary-archives above only package it). Same pattern as
  # the stable primary-release, on branch push instead of a tag. The `main` matcher already
  # resolves to ^(main|dev-go-port)$, so this covers the Go-port branch too.
  - id: dwiz-desktop-dev-release
    kind: release
    type: prerelease
    archives: dwiz-desktop-dev-latest
    tag: "dev-{sha:8}"
    aliases: ["latest-dev"]
    retention:
      keep_last: 6
      protect: ["latest-dev"]
    when: { branches: [main], events: [push, manual] }

  # ── Stable release — tagged versions ────────────────────────────────────────
  - id: dwiz-desktop-archive
    kind: binary-archive
    build: dwiz-desktop
    format: auto
    name: "VDisplay-Wizard-{version}-{os}-{arch}"
    include: ["README.md", "LICENSE"]
    checksums: true
    when: { git_tags: [stable], events: [tag] }

  - id: primary-release
    kind: release
    archives: dwiz-desktop-archive
    aliases: ["v{version}", "latest"]
    when: { git_tags: [stable], events: [tag] }

  - id: github-release
    kind: release
    mirror: github-mirror
    sync_release: true
    when: { git_tags: [stable], events: [tag] }

dependency:
  enabled: true
  output: ".stagefreight/deps"
  scope:
    go_modules: true
  commit:
    enabled: true
    type: chore
    message: "update managed dependencies"
    push: true
    skip_ci: false

lint:
  level: full
  modules:
    freshness:
      options:
        severity:
          # Major-version-behind is advisory, not build-blocking. CVE-affected deps
          # still escalate to critical via severity_override (default on).
          major: 1

release:
  enabled: true
